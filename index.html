<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1C00EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Neat Team">
  <meta property="og:image" content="assets/Neatteam.jpg">
  <title>Neat Team</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/components.css">
  <script>
    // Apply the device theme before first paint (NeatSystem 1.3, Design 9.1)
    try { var t = (JSON.parse(localStorage.getItem('ns:neatsystem:device') || '{}') || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center">
      <img src="assets/neat_logo_no_background.png" alt="" width="120" height="120" onerror="this.replaceWith(Object.assign(document.createElement('img'),{src:'assets/icon.svg',width:96,height:96}))">
    </div>
  </div>
  <script type="module" src="core/app.js"></script>
</body>
</html>
